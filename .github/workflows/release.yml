name: Release

# 打 tag(v*)即发布:跑测试与隐私门禁 → 打包 → 生成 GitHub Release 并附上发布包。
# 用 runner 自带的 gh CLI + GITHUB_TOKEN, 不需要任何额外凭据。
# 发布说明取自 CHANGELOG.md 里该版本的段落(取不到才回退到自动生成的 notes);
# 重复推同一个 tag 时会更新既有 Release 而不是报错。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 需要 tag 做一致性校验
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 隐私与密钥扫描
        run: python tools/check_secrets.py --history

      - name: 全量测试
        run: python tests/smoke.py

      - name: 打包
        run: python pack.py

      - name: 校验"包 == 工作区 == 已提交 == tag"
        run: python tools/verify_package.py --require-tag

      - name: 生成校验和
        run: |
          cd dist
          sha256sum qqops-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 取本次发布说明(CHANGELOG 里那一段)
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          if python tools/changelog_notes.py "$ver" > RELEASE_NOTES.md 2>/dev/null && [ -s RELEASE_NOTES.md ]; then
            # 附上发布包信息, 下载的人不用自己算一遍
            {
              echo ""
              echo "---"
              echo ""
              echo "### 发布包"
              echo ""
              echo '```'
              ls -l dist/qqops-*.tar.gz | awk '{print $9, $5 " bytes"}'
              cat dist/SHA256SUMS.txt
              echo '```'
            } >> RELEASE_NOTES.md
            echo "已从 CHANGELOG 取到 $ver 的说明($(wc -l < RELEASE_NOTES.md) 行)"
          else
            rm -f RELEASE_NOTES.md
            echo "::notice::CHANGELOG 里没有 $ver 的段落, 回退到 GitHub 自动生成的 notes"
          fi

      - name: 创建(或更新)Release 并附上发布包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -s RELEASE_NOTES.md ]; then notes=(--notes-file RELEASE_NOTES.md); else notes=(--generate-notes); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            # tag 重推/重跑时不要让 workflow 挂在"Release 已存在"上
            gh release edit "${GITHUB_REF_NAME}" --title "QQOps ${GITHUB_REF_NAME}" "${notes[@]}"
            gh release upload "${GITHUB_REF_NAME}" dist/qqops-*.tar.gz dist/SHA256SUMS.txt --clobber
            echo "已更新既有 Release"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/qqops-*.tar.gz \
              dist/SHA256SUMS.txt \
              --title "QQOps ${GITHUB_REF_NAME}" \
              "${notes[@]}" \
              --verify-tag
            echo "已创建 Release"
          fi
