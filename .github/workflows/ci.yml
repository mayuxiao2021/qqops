name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 兜底: 代码里每个入口都会自己切 UTF-8, 这里再保证一次(CI 的 Windows 默认是 cp437)
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: 隐私与密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --history 需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描工作区
        run: python tools/check_secrets.py
      - name: 扫描全历史
        run: python tools/check_secrets.py --history

  test:
    name: 测试 ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.10"
          - os: macos-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 语法检查
        run: python -m compileall -q qqops
      - name: 冒烟测试(纯标准库, 不需要网络)
        shell: bash
        run: |
          set +e
          python tests/smoke.py > smoke.log 2>&1
          rc=$?
          cat smoke.log
          if [ $rc -ne 0 ]; then
            # 把失败测试名 + 堆栈行号 + 原因发成 annotation: 日志要登录才能看, annotation 是公开的
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
            import re, sys
            log = open("smoke.log", encoding="utf-8", errors="replace").read().splitlines()
            def esc(s):
                return s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            hits = [i for i, l in enumerate(log) if re.match(r"^(FAIL|ERROR): ", l)]
            for i in hits[:8]:
                name = log[i]
                # 从失败头往后找第一段 Traceback 的关键行(文件名:行号 + 异常类型)
                ctx = [l for l in log[i + 1:i + 40] if re.search(r'File ".*", line \d+|^[A-Za-z]*Error|^AssertionError', l)]
                detail = " / ".join(x.strip() for x in ctx[-3:]) or "(无堆栈)"
                print("::error title=%s::%s" % (esc(name[:120]), esc(detail[:600])))
                print("- %s\n  - %s" % (name, detail))
            PY
          fi
          exit $rc
      - name: 确认没有第三方依赖
        run: python -c "import sys; sys.path.insert(0,'.'); import qqops, qqops.core, qqops.collector, qqops.summarizer, qqops.webapp, qqops.runner; print('import ok')"

  console:
    name: 控制台前端探针
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 用桩 DOM 渲染全部页面并点一遍关键按钮
        run: node tools/console_probe.js

  package:
    name: 打包与一致性
    runs-on: ubuntu-latest
    needs: [privacy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 打包
        run: python pack.py
      - name: 校验包内文件与权限位
        run: python tools/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: qqops-package
          path: dist/*.tar.gz
          if-no-files-found: error
