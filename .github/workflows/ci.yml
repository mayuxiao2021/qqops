name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 兜底: 代码里每个入口都会自己切 UTF-8, 这里再保证一次(CI 的 Windows 默认是 cp437)
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: 隐私与密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # --history 需要完整历史
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描工作区
        run: python tools/check_secrets.py
      - name: 扫描全历史
        run: python tools/check_secrets.py --history

  test:
    name: 测试 ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
        exclude:
          - os: windows-latest
            python: "3.10"
          - os: macos-latest
            python: "3.10"
        include:
          # macOS 属于"尽力支持": 代码里有 ps/lsof 兜底, 但 CI 上独立启动 collector/webapp
          # 的用例仍失败(子进程无任何输出, 原因待查) → 标为实验性, 失败不阻塞发布,
          # 信号仍留在 Actions 里。详见 README「平台支持」。
          - os: macos-latest
            python: "3.12"
            experimental: true
          - os: macos-latest
            python: "3.13"
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 语法检查
        run: python -m compileall -q qqops
      - name: 冒烟测试(纯标准库, 不需要网络)
        shell: bash
        run: |
          set +e
          python tests/smoke.py > smoke.log 2>&1
          rc=$?
          cat smoke.log
          if [ $rc -ne 0 ]; then
            # 失败测试名 + 堆栈行号 + 原因 → annotation(公开可读)与 job summary
            python tools/ci_annotate.py smoke.log --summary
          fi
          exit $rc
      - name: 确认没有第三方依赖
        run: python -c "import sys; sys.path.insert(0,'.'); import qqops, qqops.core, qqops.collector, qqops.summarizer, qqops.webapp, qqops.runner; print('import ok')"

  console:
    name: 控制台前端探针
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 用桩 DOM 渲染全部页面并点一遍关键按钮
        run: node tools/console_probe.js

  package:
    name: 打包与一致性
    runs-on: ubuntu-latest
    needs: [privacy, test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # 需要 tag 才能做"包 == 已提交 == tag"的一致性检查
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 打包
        run: python pack.py
      - name: 校验"包 == 工作区 == 已提交"
        run: python tools/verify_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: qqops-package
          path: dist/*.tar.gz
          if-no-files-found: error
