name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说清**要解决什么问题**,再说想要什么方案 —— 方案往往有更简单的实现。
        注意:核心必须保持零第三方依赖(见 CONTRIBUTING.md 的红线)。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的做法为什么不够用?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你期望的方案
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面
      options:
        - label: 需要新增第三方依赖(请说明为什么标准库做不到)
        - label: 涉及控制台前端
        - label: 涉及 OneBot/NapCat 协议
        - label: 涉及模型/成本
